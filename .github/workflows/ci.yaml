name: CI

# Runs on every branch push. A PR's checks come from the push of its head commit,
# so the branch protection on main can require these job names directly.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  webapp-tests:
    runs-on: ${{ github.ref == 'refs/heads/prod' && 'ubuntu-latest' || 'self-hosted' }}
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit
      - run: npm run test:ci
      # The build only needs the env vars to exist, not real values. SUPABASE_SECRET is read
      # when the admin client module loads, so the password reset routes fail without it.
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
          NEXT_PUBLIC_PROTOMAPS_API_KEY: ci-placeholder
          SUPABASE_SECRET: ci-placeholder
      # test:ci writes coverage/ first, so keep the generated report out of the lint run.
      - run: npm run lint -- --max-warnings 0 --ignore-pattern 'coverage/**'

  docs-build:
    runs-on: ${{ github.ref == 'refs/heads/prod' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install mkdocs-material
      - run: mkdocs build --clean

  hook-tests:
    runs-on: ${{ github.ref == 'refs/heads/prod' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - uses: actions/checkout@v4
      - run: sh .githooks/test-hooks.sh
      - run: bash .github/scripts/test-sync-sapaa-dev.sh
