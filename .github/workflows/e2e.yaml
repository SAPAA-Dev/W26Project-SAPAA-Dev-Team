name: E2E

# Cypress specs against a throwaway local Supabase (migrations + supabase/seed.sql +
# scripts/e2e_seed.js). Runs on PRs into main/release and by hand only, to save Actions minutes.
# A hand run can give the url input of the deployed site; the local Supabase and the Next.js
# server are then skipped. The CYPRESS_* test-account logins are set on the runner.
on:
  pull_request:
    branches: [main, release]
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL of the deployed site. Leave empty to run against the local stack.'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cypress:
    runs-on: self-hosted
    timeout-minutes: 30
    defaults:
      run:
        working-directory: webapp
    env:
      NEXT_TELEMETRY_DISABLED: 1
      # Empty on PR runs.
      DEPLOYED_URL: ${{ github.event.inputs.url }}
      # The map is not under test, so it needs no real Protomaps key.
      NEXT_PUBLIC_PROTOMAPS_API_KEY: ci-placeholder
      # Specs run in CI: they need only the seeded users, sites, boundaries and report from
      # scripts/e2e_seed.js. All passed locally on 2026-10-12.
      # Not run here, with reasons:
      #   add_form_editor, hide_form_editor, modify_form_editor, edit_site_inspection_form,
      #   full_form_fill_persistence, required_questions_submit_block, image_caption_upload,
      #   image_upload, image_upload_section_persistence: need the production inspection form
      #   (sections like WhoRYou/Close, question keys like Q11) or report id 3237.
      #   admin_media_management: needs real uploaded images ("Ski Trails") in S3.
      #   Not tried against the local seed yet: admin_gallery, user_gallery, site_details_gallery
      #   (API stubs), rich_text_editor, edit_site_profile, disable_site_profile, pdf_export,
      #   homepage_image_upload (seeded Riverlot 56 site, no S3 upload).
      E2E_SPECS: cypress/e2e/logout.cy.ts,cypress/e2e/profile.cy.ts,cypress/e2e/authorized_check.cy.ts,cypress/e2e/add_site.cy.ts,cypress/e2e/archive_report.cy.ts,cypress/e2e/deactivate_site.cy.ts,cypress/e2e/map_filter.cy.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json

      # 3000 is the first choice; another job on the runner can hold it, so take the next free port.
      - name: Find a free port for the local server
        if: env.DEPLOYED_URL == ''
        run: |
          port=$(node -e '
            const net = require("net");
            const free = (candidate) => new Promise((resolve) => {
              const server = net.createServer();
              server.once("error", () => resolve(false));
              server.once("listening", () => server.close(() => resolve(true)));
              server.listen(candidate);
            });
            (async () => { for (let candidate = 3000; ; candidate++) if (await free(candidate)) { console.log(candidate); return; } })();
          ')
          echo "E2E_PORT=$port" >> "$GITHUB_ENV"

      - uses: supabase/setup-cli@v3.0.1
        if: env.DEPLOYED_URL == ''
        with:
          version: 2.118.0

      # Only the services the app uses: Postgres, Auth, PostgREST and the Kong gateway.
      - name: Start local Supabase (applies migrations and seed.sql)
        if: env.DEPLOYED_URL == ''
        run: supabase start -x studio,postgres-meta,edge-runtime,storage-api,imgproxy,logflare,vector,mailpit,realtime,supavisor

      - uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('webapp/package-lock.json') }}
      - run: npm ci

      # Creates the E2E users and rows, and exports the local URL/keys and CYPRESS_* logins.
      - name: Seed E2E data
        if: env.DEPLOYED_URL == ''
        run: node scripts/e2e_seed.js >> "$GITHUB_ENV"

      - run: npm run build
        if: env.DEPLOYED_URL == ''

      - name: Run the specs against the local server
        if: env.DEPLOYED_URL == ''
        uses: cypress-io/github-action@v7.4.6
        with:
          working-directory: webapp
          install: false
          browser: electron
          start: npx next start -p ${{ env.E2E_PORT }}
          wait-on: http://localhost:${{ env.E2E_PORT }}/login
          wait-on-timeout: 120
          spec: ${{ env.E2E_SPECS }}
        env:
          CYPRESS_BASE_URL: http://localhost:${{ env.E2E_PORT }}

      - name: Run the specs against the deployed site
        if: env.DEPLOYED_URL != ''
        uses: cypress-io/github-action@v7.4.6
        with:
          working-directory: webapp
          install: false
          browser: electron
          spec: ${{ env.E2E_SPECS }}
        env:
          CYPRESS_BASE_URL: ${{ env.DEPLOYED_URL }}

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: webapp/cypress/screenshots
          if-no-files-found: ignore
